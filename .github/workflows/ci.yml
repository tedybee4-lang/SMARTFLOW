name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: smartflow/package-lock.json
      - run: npm ci
        working-directory: smartflow
      - run: npm run lint
        working-directory: smartflow
      - run: npm run typecheck
        working-directory: smartflow
      - run: npm test
        working-directory: smartflow
      - run: npm run build
        working-directory: smartflow
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
